# Fetches real coordinates for every town, once, and commits them.
#
# 2026-08-17. The town pages declare a `Place` schema node naming the town they
# are about, and until now it carried no coordinates because nothing in the repo
# had any — and thirty-six latitudes recalled from memory would be thirty-six
# chances to be quietly wrong in a way no validator would catch.
#
# This runs build/tools/geocode_towns.py against the Google Geocoding API, which
# Christine already pays for, and commits build/data/town_geo.json.
#
# NOT SCHEDULED, on purpose. Town coordinates do not change. This is a button you
# press once, and again only if a town is added to the site. Re-running is cheap
# and safe: the script skips towns it already has unless --force is passed.
#
# REQUIRED SECRET
#   GOOGLE_MAPS_API_KEY — the same value already in Netlify (Site configuration →
#   Environment variables). Add it at GitHub → Settings → Secrets and variables →
#   Actions. The key must have the **Geocoding API** enabled specifically; a key
#   that works for Distance Matrix is not automatically enabled for Geocoding,
#   and the script fails loudly with that exact message if it isn't.
#
# Until this has run, every town page emits Place without geo — which is the
# designed fallback, not a breakage.
name: geocode towns

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-fetch every town, even ones already stored"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the key is configured
        id: creds
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::GOOGLE_MAPS_API_KEY is not set as a repository secret."
            echo "::error::Copy it from Netlify → Site configuration → Environment"
            echo "::error::variables, then add it under Settings → Secrets and"
            echo "::error::variables → Actions. Nothing was changed."
            exit 1
          fi

      - name: Install build dependencies
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Geocode the towns
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python3 build/tools/geocode_towns.py --force
          else
            python3 build/tools/geocode_towns.py
          fi

      - name: Rebuild so the committed site carries the new schema
        run: python3 build/build.py

      - name: Verify nothing else broke
        run: |
          for t in tests/test-*.js; do node "$t" >/dev/null || { echo "FAILED $t"; exit 1; }
          done
          echo "all suites passed"

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- build/data/town_geo.json site; then
            echo "Coordinates unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/data/town_geo.json site
          git commit -m "Add real town coordinates from the Google Geocoding API" \
                     -m "Generated by build/tools/geocode_towns.py. No latitude in this commit was typed by hand."
          git push
