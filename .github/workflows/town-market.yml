# Keeps the town pages' market figures alive.
#
# 2026-08-16. build/data/town_market.json is what lets a town page say "there are
# 214 active listings in Loveland, at a median asking price of $689,000" instead
# of a paragraph explaining why it won't say that. build.py refuses to publish
# those figures once the file is more than 21 days old, so WITHOUT a job like this
# the feature works beautifully for three weeks and then quietly turns itself off
# — which is the worst of both worlds: the effort spent, the benefit expired, and
# nothing on fire to tell anyone.
#
# So: regenerate on a schedule, commit the result, and let the push trigger the
# normal Netlify rebuild. The numbers are then only ever as old as the last run,
# and no human ever types a market figure into this repo.
#
# REQUIRED SECRETS — until these are set this job skips itself cleanly rather than
# failing every Monday and training everyone to ignore the red X:
#   BLOBS_SITE_ID, BLOBS_TOKEN   (same values the Netlify functions already use;
#                                 Netlify → Site settings → Environment variables)
#
# It reads the listings sync-listings.js has ALREADY replicated into Netlify Blobs,
# so it adds no load to the IRES feed and cannot disagree with what the site's own
# search shows.
name: town market data

on:
  schedule:
    # Mondays and Thursdays, a little after the hour. Twice a week keeps the
    # figures comfortably inside the 21-day window even if a run is missed.
    - cron: "20 13 * * 1,4"
  workflow_dispatch:

# The job commits to the repo, so it needs write access to contents.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check credentials are configured
        id: creds
        env:
          BLOBS_SITE_ID: ${{ secrets.BLOBS_SITE_ID }}
          BLOBS_TOKEN: ${{ secrets.BLOBS_TOKEN }}
        run: |
          if [ -n "$BLOBS_SITE_ID" ] && [ -n "$BLOBS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BLOBS_SITE_ID / BLOBS_TOKEN are not set, so the town market"
            echo "::notice::figures cannot be refreshed. The town pages fall back to"
            echo "::notice::qualitative copy on their own — nothing is broken, but the"
            echo "::notice::live prices stay off until these secrets are added."
          fi

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Regenerate town market statistics
        if: steps.creds.outputs.ready == 'true'
        env:
          BLOBS_SITE_ID: ${{ secrets.BLOBS_SITE_ID }}
          BLOBS_TOKEN: ${{ secrets.BLOBS_TOKEN }}
        run: node build/tools/town-market-stats.js

      # Rebuild so the committed site/ matches the new data. netlify-build.sh
      # regenerates on deploy anyway, but this repo deliberately keeps site/ in
      # git as the fallback and as an honest diff of what a data change produces.
      - name: Rebuild the site
        if: steps.creds.outputs.ready == 'true'
        run: python3 build/build.py

      # 2026-08-17: was `node tests/test-townmarket.js` alone. This job commits
      # a regenerated site/ — 37 town pages on the last run — so it verifies the
      # whole tree, not just the figures it came here to change. The suites take
      # about a second; a rebuild that quietly breaks the mobile grid while the
      # market numbers stay correct is exactly what one suite would miss.
      - name: Verify the whole tree before publishing
        if: steps.creds.outputs.ready == 'true'
        run: |
          for t in tests/test-*.js; do node "$t" >/dev/null || { echo "FAILED $t"; node "$t"; exit 1; }
          done
          echo "all suites passed"

      # Shared with geocode-towns.yml. Retries a rejected push by rebuilding on
      # top of the new master rather than rebasing generated HTML — see the long
      # note in the script for why the first overlap of these two jobs threw
      # away a complete, correct run.
      - name: Commit if anything changed
        if: steps.creds.outputs.ready == 'true'
        run: |
          scripts/commit-generated.sh \
            "Refresh town market figures from live IRES inventory" \
            "Generated by build/tools/town-market-stats.js from the listings already replicated into Netlify Blobs. No figure in this commit was typed by hand." \
            build/data/town_market.json
