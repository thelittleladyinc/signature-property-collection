# The finished site is pre-built and committed in /site, so Netlify just
# serves it directly — no build step, nothing that can fail at deploy time.
# To make content changes: edit build/build.py, run `python3 build/build.py`
# locally to regenerate /site, then commit and push both.
# (site/_redirects already handles "/" -> "/index.html".)
[build]
  publish = "site"

[functions]
  directory = "netlify/functions"

# Replicates Christine's licensed IRES listings from MLS Grid into Netlify
# Blobs every 15 minutes (MLS Grid's own recommended cadence — see
# sync-listings.js's file comment for why a live per-search query to MLS
# Grid doesn't work and this replication step is required instead).
[functions."sync-listings"]
  schedule = "*/15 * * * *"
