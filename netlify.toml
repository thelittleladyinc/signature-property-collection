# 2026-08-15: Netlify now REGENERATES the site on every deploy, so editing
# build/build.py and pushing is enough. It previously ran no build at all and
# published the committed /site as-is, which meant a content change pushed
# without a local rebuild silently did nothing — no error, no clue.
#
# The original reasoning ("nothing that can fail at deploy time") is preserved
# rather than discarded: scripts/netlify-build.sh treats a build-image problem
# (no python3, pip failure) as non-fatal and publishes the committed /site
# exactly as before, and treats an actual generator error as fatal so a
# half-written /site is never published and the last good deploy keeps serving.
# See that script's header for the full reasoning; its failure paths are
# covered by tests.
#
# Committing /site is still worth doing: it stays the fallback, and it keeps
# `git diff` honest about what a content change actually produces.
# (site/_redirects already handles "/" -> "/index.html".)
[build]
  command = "bash scripts/netlify-build.sh"
  publish = "site"

[functions]
  directory = "netlify/functions"
  # 2026-08-17: /listing/<id> crashed in production with
  #   ENOENT: no such file or directory, open
  #   '/var/task/netlify/functions/lib/_listing-page-shell.html'
  #
  # The file is committed and not ignored. The problem is that Netlify's bundler
  # ships what it can TRACE, and it traces require(). Every other file in lib/ is
  # .js or .json and gets pulled in that way -- _local-spots.json and
  # _sold-homes-data.json are both require()d, which is why they have always
  # worked. The shell is the one file read at runtime with fs.readFileSync, which
  # the bundler cannot see, so it was never packaged.
  #
  # This is why the feature could pass every static check and still be broken: the
  # file exists in the repo, the reference is correct, the build produces it -- and
  # none of that puts it inside the deployed function.
  included_files = ["netlify/functions/lib/_listing-page-shell.html", "netlify/functions/lib/_listing-page-shell-tllsh.html"]

# 2026-08-14: there was no [[headers]] block at all. Two costs, in order of
# impact:
#
#  1. No Cache-Control on static assets. The site ships ~5.5MB of imagery,
#     and every byte of it was being revalidated far more often than
#     necessary -- a direct, free Core Web Vitals win on exactly the
#     community pages that need to rank on mobile.
#  2. No baseline security headers, on a site collecting lead data through
#     68 forms. Not ranking factors, but standard hygiene.
#
# Every long-lived asset gets an immutable TTL. CSS/JS earned that on 2026-08-17
# by becoming content-hashed (see the block below and fingerprint_assets() in
# build.py) -- until then they were deliberately on a short TTL, because caching an
# unversioned filename for a year would mean a style change never reaching anyone.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/qr/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 2026-08-17: these were max-age=3600 with UNVERSIONED filenames, and it cost a
# whole afternoon of confusion. Christine reported two bugs that were already
# fixed — her map spots "disappearing on zoom" (there is not one zoom handler in
# map.js) and the market-report stat block rendering as run-together text (the CSS
# for it is present and correct, and byte-identical to source). Both were her
# browser serving an asset from before the deploy that fixed them.
#
# The general failure is worse than the confusion: for an hour after every deploy,
# returning visitors ran the OLD JavaScript against the NEW HTML. A mismatch
# between markup and the script driving it produces behaviour nobody can reproduce.
#
# build.py now content-hashes every CSS/JS file and rewrites the references
# (fingerprint_assets(), the last step of the build), so a changed file gets a new
# NAME. A deploy therefore reaches everyone instantly — there is nothing stale left
# to serve — and because the filename now identifies the content, these can be
# cached as hard as the images are. Repeat visitors stop re-fetching 71KB of CSS
# and 48KB of map code on every visit.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Replicates Christine's licensed IRES listings from MLS Grid into Netlify
# Blobs (see sync-listings.js's file comment for why a live per-search query to
# MLS Grid doesn't work and this replication step is required instead).
#
# 2026-08-17: 15 minutes -> 30, at Christine's request, after sustained 429s from
# MLS Grid's media host. Worth being clear about what this does and does not buy,
# so nobody later mistakes it for the fix:
#
# This job was never the glutton. It is paced at REQUEST_DELAY_MS (1500ms) inside
# a TIME_BUDGET_MS of 11s, so it makes at most ~7 API calls per run -- roughly 670
# a day at 15 minutes, and ~335 at 30. Against MLS Grid's limits that is small
# either way. The 429s are on the MEDIA host and are driven by photo traffic plus
# the two OTHER apps sharing this account (Listing-Engine, Expired-Luxury), which
# is the real capacity question.
#
# So this halves an already-small footprint. It is cheap, it is safe, and the only
# visible cost is that a brand-new listing can take up to 30 minutes to appear
# instead of 15 -- which no visitor will notice. The sync is resumable by design
# (each run continues where the last stopped), so a longer gap changes pace, never
# completeness.
[functions."sync-listings"]
  schedule = "*/30 * * * *"

# Clean, shareable, indexable URL for one listing:
#   /listing/IRE1234567  ->  netlify/functions/listing-page.js
#
# 2026-08-15 (Christine: "No individual listing pages... there's no link a buyer
# can text a spouse, and Google can't index a single address"). A 200 rewrite
# rather than a 301 so the pretty URL is the one that stays in the address bar,
# gets shared, and is what the page's own canonical tag points at.
#
# force = false so a real file at that path would still win -- nothing is there
# today, and this way adding one later doesn't require remembering this rule.
[[redirects]]
  from = "/listing/:id"
  to = "/.netlify/functions/listing-page?id=:id"
  status = 200
  force = false

[functions."area-alerts-run"]
  schedule = "0 */6 * * *"
